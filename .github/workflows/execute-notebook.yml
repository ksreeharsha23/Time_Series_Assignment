name: Execute forecasting notebook
on:
  push:
    paths:
      - 'Time_Series_Forecasting_Assignments.ipynb'
      - 'requirements.txt'
      - '.github/workflows/execute-notebook.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Execute all notebook cells
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          path = 'Time_Series_Forecasting_Assignments.ipynb'
          nb = nbformat.read(path, as_version=4)
          NotebookClient(nb, timeout=1200, kernel_name='python3').execute()
          nbformat.write(nb, path)
          print('All notebook cells executed and output saved.')
          PY
      - name: Commit executed output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Time_Series_Forecasting_Assignments.ipynb
          if ! git diff --cached --quiet; then
            git commit -m 'Save executed assignment results [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
